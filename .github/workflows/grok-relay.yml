name: grok-relay

on:
  push:
    branches:
      - main
    paths:
      - "grok-relay/requests/**"
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Call GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 grok-relay/run.py

      - name: Commit responses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grok-relay/responses
          if git diff --cached --quiet; then
            echo "No response changes to commit."
          else
            git commit -m "grok-relay: responses"
            git push
          fi
